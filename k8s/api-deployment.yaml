apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertexerp-api
  namespace: vertexerp-production
  labels:
    app: vertexerp-api
    tier: backend
    version: v1.0.0
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vertexerp-api
  template:
    metadata:
      labels:
        app: vertexerp-api
        tier: backend
        version: v1.0.0
    spec:
      containers:
        - name: api
          image: ghcr.io/reegangladis/vertexerp-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
