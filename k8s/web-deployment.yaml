apiVersion: apps/v1
kind: Deployment
metadata:
  name: vertexerp-web
  namespace: vertexerp-production
  labels:
    app: vertexerp-web
    tier: frontend
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vertexerp-web
  template:
    metadata:
      labels:
        app: vertexerp-web
        tier: frontend
        version: v1.0.0
    spec:
      containers:
        - name: web
          image: ghcr.io/reegangladis/vertexerp-web:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 101
