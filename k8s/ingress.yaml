apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vertexerp-ingress
  namespace: vertexerp-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - vertexerp.ai
        - api.vertexerp.ai
      secretName: vertexerp-tls-cert
  rules:
    - host: vertexerp.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vertexerp-web-svc
                port:
                  number: 80
    - host: api.vertexerp.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vertexerp-api-svc
                port:
                  number: 8000
