version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # Staging Reverse Proxy & Load Balancer (Nginx)
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: vertexerp-proxy-staging
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/vertexerp.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vertexerp-staging-network

  # ----------------------------------------------------------------------------
  # Staging Frontend SPA Container
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vertexerp-frontend-staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vertexerp-staging-network

  # ----------------------------------------------------------------------------
  # Database Migration Runner (One-Shot Task)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertexerp-migration-staging
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.staging
    networks:
      - vertexerp-staging-network

  # ----------------------------------------------------------------------------
  # Staging API Backend (FastAPI / Uvicorn)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertexerp-api-staging
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--timeout-graceful-shutdown", "30"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - vertexerp-staging-network

  # ----------------------------------------------------------------------------
  # Staging Background Worker Daemon
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertexerp-worker-staging
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.staging
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vertexerp-staging-network

  # ----------------------------------------------------------------------------
  # Staging Database: PostgreSQL 16 + pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vertexerp-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-vertex_staging_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-vertexerp_staging}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-vertex_staging_user} -d ${DATABASE_NAME:-vertexerp_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vertexerp-staging-network

  # ----------------------------------------------------------------------------
  # Staging In-Memory Broker & Cache: Redis 7.2
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: vertexerp-redis-staging
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vertexerp-staging-network

  # ----------------------------------------------------------------------------
  # Staging Object Storage: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-09-09T00-53-02Z
    container_name: vertexerp-minio-staging
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-staging_storage_admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set}
    volumes:
      - minio_staging_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vertexerp-staging-network

networks:
  vertexerp-staging-network:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
  minio_staging_data:
