# Render Blueprint Configuration for VertexERP AI
services:
  # ──────────────────────────────────────────
  # Backend API (FastAPI)
  # ──────────────────────────────────────────
  - type: web
    name: vertexerp-backend
    env: python
    region: singapore
    rootDir: .
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r apps/api/requirements.txt
    startCommand: |
      cd apps/api
      alembic upgrade head
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PROJECT_NAME
        value: VertexERP AI
      - key: API_V1_STR
        value: /api/v1
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: DATABASE_URL
        fromDatabase:
          name: vertexerp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vertexerp-redis
          property: connectionString

  # ──────────────────────────────────────────
  # Frontend UI (React + Vite Static Site)
  # ──────────────────────────────────────────
  - type: web
    name: vertexerp-frontend
    env: static
    rootDir: .
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://vertexerp-backend.onrender.com/api/v1

  # ──────────────────────────────────────────
  # Managed Redis Cache
  # ──────────────────────────────────────────
  - type: redis
    name: vertexerp-redis
    ipAllowList: []

databases:
  # ──────────────────────────────────────────
  # Managed PostgreSQL Database
  # ──────────────────────────────────────────
  - name: vertexerp-db
    databaseName: vertexerp_db
    user: vertexuser
