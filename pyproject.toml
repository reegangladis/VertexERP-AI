[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertexerp-v2"
version = "2.0.0"
description = "VertexERP AI V2 - Production Multi-Tenant ERP Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "VertexERP Core Architecture Team", email = "architecture@vertexerp.io" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.1.1",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis[hiredis]>=5.1.0",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.1",
    "pgvector>=0.3.5",
    "minio>=7.2.8"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "types-redis>=4.6.0.20241004",
    "aiosqlite>=0.20.0",
    "fakeredis[lua]>=2.25.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "E501", # line too long
    "B904", # within an except clause, raise ... from err
    "SIM117", # combine with statements
    "E741", # ambiguous variable name
    "B017", # assert blind Exception in tests
]


[tool.ruff.lint.per-file-ignores]
"app/modules/finance/models/*" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "app.modules.*",
    "app.api.*",
    "app.core.metrics"
]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
