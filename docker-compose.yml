version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: vertexerp_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-vertexerp_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vertexerp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vertexerp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vertexerp_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - vertexerp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/api
      dockerfile: ../../docker/Dockerfile.api
    container_name: vertexerp_backend
    restart: always
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-VertexERP AI}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - API_V1_STR=${API_V1_STR:-/api/v1}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:8000"]}
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_password_123}
      - POSTGRES_DB=${POSTGRES_DB:-vertexerp_db}
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vertexerp_network

  frontend:
    build:
      context: ./apps/web
      dockerfile: ../../docker/Dockerfile.web
    container_name: vertexerp_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vertexerp_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  vertexerp_network:
    driver: bridge
