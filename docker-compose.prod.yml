version: "3.9"

services:
  # ----------------------------------------------------------------------------
  # Production Reverse Proxy & TLS Termination (Nginx)
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: vertexerp-proxy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d/vertexerp.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    networks:
      - vertexerp-public-net

  # ----------------------------------------------------------------------------
  # Production Frontend SPA Container (Nginx Static)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vertexerp-frontend-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 64M
    networks:
      - vertexerp-public-net

  # ----------------------------------------------------------------------------
  # Production Database Migration Runner (One-Shot Task)
  # ----------------------------------------------------------------------------
  migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertexerp-migration-prod
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    networks:
      - vertexerp-internal-net

  # ----------------------------------------------------------------------------
  # Production API Server (FastAPI / Multi-Worker Uvicorn)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertexerp-api-prod
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--timeout-graceful-shutdown", "30"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - vertexerp-public-net
      - vertexerp-internal-net

  # ----------------------------------------------------------------------------
  # Production Background Worker Daemon
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertexerp-worker-prod
    restart: always
    command: ["python", "-m", "app.worker"]
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - vertexerp-internal-net

  # ----------------------------------------------------------------------------
  # Production Database: PostgreSQL 16 with pgvector
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vertexerp-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1024MB"
      - "-c"
      - "effective_cache_size=3072MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=200"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    networks:
      - vertexerp-internal-net

  # ----------------------------------------------------------------------------
  # Production In-Memory Broker & Cache: Redis 7.2
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: vertexerp-redis-prod
    restart: always
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "volatile-lru"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - vertexerp-internal-net

  # ----------------------------------------------------------------------------
  # Production Object Storage: MinIO
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-09-09T00-53-02Z
    container_name: vertexerp-minio-prod
    restart: always
    command: server /data
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - vertexerp-internal-net
      - vertexerp-public-net

networks:
  vertexerp-public-net:
    driver: bridge
  vertexerp-internal-net:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:
