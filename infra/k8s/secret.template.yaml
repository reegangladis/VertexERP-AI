apiVersion: v1
kind: Secret
metadata:
  name: vertexerp-secrets
  namespace: vertexerp-production
  labels:
    app.kubernetes.io/name: vertexerp
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  JWT_SECRET_KEY: "REPLACE_WITH_SECURE_JWT_SECRET_KEY_MIN_32_BYTES"
  DATABASE_USER: "vertex_prod_app"
  DATABASE_PASSWORD: "REPLACE_WITH_STRONG_PRODUCTION_DATABASE_PASSWORD"
  REDIS_PASSWORD: ""
  STORAGE_ACCESS_KEY: "REPLACE_WITH_S3_ACCESS_KEY"
  STORAGE_SECRET_KEY: "REPLACE_WITH_S3_SECRET_KEY"
  AI_GATEWAY_API_KEY: "REPLACE_WITH_OPENAI_OR_ANTHROPIC_API_KEY"
