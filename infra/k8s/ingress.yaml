apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vertexerp-ingress
  namespace: vertexerp-production
  labels:
    app.kubernetes.io/name: vertexerp
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "false" # Handled in FastAPI / Nginx layer
spec:
  tls:
    - hosts:
        - app.vertexerp.io
        - api.vertexerp.io
      secretName: vertexerp-tls-secret
  rules:
    - host: app.vertexerp.io
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: vertexerp-api-service
                port:
                  number: 8000
          - path: /health/
            pathType: Prefix
            backend:
              service:
                name: vertexerp-api-service
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: vertexerp-api-service
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: vertexerp-api-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vertexerp-frontend-service
                port:
                  number: 80
    - host: api.vertexerp.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vertexerp-api-service
                port:
                  number: 8000
